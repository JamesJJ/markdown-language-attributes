name: Go checks

# PR-blocking checks. Branch protection on main should require the
# "Build & test (Go)" job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same ref (PR branch or main).
  group: go-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Build & test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Check formatting (gofmt -l)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Report suspicious constructs (go vet)
        run: go vet ./...

      - name: Static analysis (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Run unit tests with race detector (go test -race)
        run: go test -race -count=1 ./...

      - name: Compile all packages (go build)
        run: go build ./...
