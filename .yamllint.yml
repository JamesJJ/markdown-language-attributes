---
# yamllint configuration for this repository's workflow files.
extends: default

rules:
  # GitHub Actions uses the reserved word "on:" which yamllint's default
  # truthy rule flags; allow it.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  line-length:
    max: 120
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
